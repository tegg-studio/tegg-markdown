name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:cas
      - run: npm run check:consumers
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: node scripts/release-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            .validation/browser-results.json
            .validation/package-evidence.json
            .validation/release-evidence.json
            test-results/
