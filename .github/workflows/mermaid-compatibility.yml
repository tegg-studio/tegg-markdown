name: Mermaid compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mermaid:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['11.9.0', '11.10.0', '11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:consumers
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/check-mermaid-consumer.mjs '${{ matrix.version }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mermaid-${{ matrix.version }}
          path: |
            .validation/mermaid-version.json
            .validation/browser-results.json
            test-results/
